<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VKRN Sanxing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root{
      --blue: #2563eb;        /* biru utama */
      --blue-dark:#1e40af;    /* biru teks */
      --blue-soft:#dbeafe;    /* biru muda bg */
      --ink:#0f172a;          /* teks gelap */
      --card:#ffffff;         /* putih */
      --line:#e2e8f0;         /* garis */
    }

    body{
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ffffff; /* putih */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: var(--ink);
    }

    .container{ width: 100%; max-width: 800px; transition: .3s ease; }

    /* Halaman awal */
    .search-page{ text-align: center; }
    .logo{
      font-size: 2.4rem;
      color: var(--blue);
      margin-bottom: 18px;
      font-weight: 700;
      line-height: 1.15;
      text-shadow: none;
    }
    .logo small{
      color: var(--blue-dark);
      margin-top: 6px;
      display:block;
      font-size: .9rem;
      font-weight: 600;
    }

    .search-box{
      background: var(--card);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid var(--blue);
      box-shadow: 0 6px 18px rgba(37,99,235,.08);
      transition: .2s ease;
    }
    .search-box:hover{ box-shadow: 0 10px 24px rgba(37,99,235,.12); }
    .search-box input{
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 10px;
      background: transparent;
      color: var(--blue-dark);
    }
    .search-box button{
      background: var(--blue);
      border: none;
      color: #fff;
      padding: 10px 26px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: .2s ease;
    }
    .search-box button:hover{ background: #1d4ed8; transform: translateY(-1px); }

    .note{ color: var(--blue); margin-top: 10px; display:block; }

    /* Hasil */
    .results-page{ display:none; }
    .results-container{
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 18px rgba(2,6,23,.06);
      height: 78vh;
      overflow-y: auto;
      margin-bottom: 14px;
    }

    .result-item{
      border: 2px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      transition: .2s ease;
      background: #fff;
    }
    .result-item:hover{ border-color: var(--blue); box-shadow: 0 6px 14px rgba(37,99,235,.1); }

    .result-table{ width: 100%; }
    .result-row{
      display: grid;
      grid-template-columns: 50% 50%;
      border-bottom: 1px solid var(--line);
    }
    .result-row:last-child{ border-bottom: none; }

    .result-label{
      font-weight: 600;
      color: var(--blue-dark);
      background: var(--blue-soft);
      padding: 10px 12px;
      border-right: 2px solid var(--line);
    }
    .result-value{
      color: var(--ink);
      padding: 10px 12px;
      word-wrap: break-word;
    }

    .button-group{ display:flex; gap:10px; justify-content:center; }
    .btn{
      flex:1; max-width:220px;
      padding: 12px 22px;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: .2s ease;
    }
    .btn-back{ background:#eff6ff; color: var(--blue-dark); border:2px solid var(--blue); }
    .btn-back:hover{ background:#e0ecff; }
    .btn-pdf{ background: var(--blue); color:#fff; }
    .btn-pdf:hover{ background:#1d4ed8; }

    /* PDF viewer */
    #pdfControls{
      text-align:center; padding: 12px;
      background: #f8fafc; border-radius: 10px; margin-bottom: 12px;
      border:1px solid var(--line);
      color: var(--blue-dark);
      font-weight: 600;
    }

    /* WA floating */
    .floating-wa-btn{
      position: fixed; bottom: 24px; right: 24px;
      width: 56px; height: 56px; background:#25D366;
      border-radius: 50%; display:flex; align-items:center; justify-content:center;
      box-shadow: 0 8px 18px rgba(37,211,102,.35);
      cursor: pointer; transition: .2s ease; z-index: 5; border: none;
    }
    .floating-wa-btn:hover{ transform: scale(1.06); }
    .floating-wa-btn svg{ width: 30px; height: 30px; fill:#fff; }

    /* Cache badge */
    .cache-indicator{
      position: fixed; top: 10px; right: 10px;
      background:#10b981; color:#fff;
      padding: 8px 14px; border-radius: 18px;
      font-size: 12px; font-weight: 600;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 10;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn{ from{opacity:0; transform: translateY(-6px);} to{opacity:1; transform:translateY(0);} }

    .loading, .no-results{ text-align:center; padding: 38px; color: var(--blue-dark); font-weight:600; }

    /* Scrollbar */
    .results-container::-webkit-scrollbar{ width: 8px; }
    .results-container::-webkit-scrollbar-track{ background:#f1f5f9; border-radius:10px; }
    .results-container::-webkit-scrollbar-thumb{ background: var(--blue); border-radius:10px; }
    .results-container::-webkit-scrollbar-thumb:hover{ background:#1d4ed8; }

    @media (max-width:768px){
      .logo{ font-size: 2rem; }
      .result-row{ grid-template-columns: 55% 45%; font-size: 14px; }
      .results-container{ padding: 14px; height: 74vh; }
    }
    @media (max-width:480px){
      .logo{ font-size: 1.6rem; }
      .search-box input{ font-size: 18px; padding: 8px; }
      .search-box button{ padding: 10px 18px; font-size: 16px; }
      .btn{ font-size: 14px; padding: 12px 14px; }
      .floating-wa-btn{ width: 50px; height: 50px; bottom: 18px; right: 12px; }
      .floating-wa-btn svg{ width: 26px; height: 26px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Search -->
    <div class="search-page" id="searchPage">
      <div class="logo">
        🔍<br/><br/>VKRN SANXING<br/>ULP WONOSOBO
        <small>Sistem informasi dan Pelaporan Pemasangan KWH VKRN Sanxing</small>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Masukkan pencarian..." autofocus />
        <button onclick="searchData()">Cari</button>
      </div>

      <small class="note">*Saat ini, pdf hanya tersedia untuk wilayah Kejajar</small>
    </div>

    <!-- Results -->
    <div class="results-page" id="resultsPage">

        </svg>
      </button>
    </div>

    <!-- PDF viewer -->
    <div class="results-page" id="pdfPage">
      <div class="results-container" id="pdfContainer">
        <div id="pdfControls">
          <button class="btn" onclick="previousPage()" style="background:#eff6ff; color:var(--blue-dark); border:2px solid var(--blue)">◄ Prev</button>
          <span style="margin:0 12px;">Halaman: <span id="pageNum"></span> / <span id="pageCount"></span></span>
          <button class="btn" onclick="nextPage()" style="background:var(--blue); color:#fff;">Next ►</button>
        </div>
        <div style="text-align:center; overflow:auto;">
          <canvas id="pdfCanvas" style="max-width:100%; height:auto; border:1px solid var(--line); border-radius:10px;"></canvas>
        </div>
      </div>
      <div class="button-group">
        <button class="btn btn-back" onclick="backToResults()">← Kembali ke Hasil</button>
      </div>
    </div>

    <!-- WA form -->
    <div class="results-page" id="waFormPage">
      <div class="results-container" style="overflow-y:auto;">
        <div style="background:#fff; padding:18px; border-radius:14px;">
          <div style="margin-bottom:14px;">
            <label style="display:block; font-weight:600; color:var(--blue-dark); margin-bottom:6px;">ID Pelanggan</label>
            <input type="text" id="waIdpel" readonly style="width:100%; padding:12px; border:2px solid var(--line); border-radius:10px; font-size:16px; background:#f8fafc;">

          <div style="margin-bottom:14px;">
            <label style="display:block; font-weight:600; color:var(--blue-dark); margin-bottom:6px;">Nama</label>
            <input type="text" id="waNama" readonly style="width:100%; padding:12px; border:2px solid var(--line); border-radius:10px; font-size:16px; background:#f8fafc;">
          </div>

          <div id="rowKelurahan" style="display:none; margin-bottom:14px;">
            <label style="display:block; font-weight:600; color:var(--blue-dark); margin-bottom:6px;">Kelurahan</label>
            <input type="text" id="waKelurahan" readonly style="width:100%; padding:12px; border:2px solid var(--line); border-radius:10px; font-size:16px; background:#f8fafc;">
          </div>

          <div id="rowKecamatan" style="display:none; margin-bottom:14px;">
            <label style="display:block; font-weight:600; color:var(--blue-dark); margin-bottom:6px;">Kecamatan</label>
            <input type="text" id="waKecamatan" readonly style="width:100%; padding:12px; border:2px solid var(--line); border-radius:10px; font-size:16px; background:#f8fafc;">

              <input type="text" id="waLokasi" readonly placeholder="Klik tombol lokasi ➡️➡️" style="flex:1; padding:12px; border:2px solid var(--line); border-radius:10px; font-size:14px; background:#f8fafc;">
              <button onclick="getCurrentLocation()" style="padding:12px 18px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-weight:700; white-space:nowrap;">📍 Lokasi</button>
            </div>
            <small style="color:var(--blue-dark); margin-top:6px; display:block;">Izinkan akses lokasi saat diminta</small>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block; font-weight:600; color:var(--blue-dark); margin-bottom:6px;">Tegangan KWH Sanxing</label>

      <div class="button-group">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    let csvData = [];
    let headers = [];
    let pdfLinks = [
      'https://raw.githubusercontent.com/pkejajar/sanxing/main/pdf/akt%20kol%20sanxing%20hidayat.pdf',
      'https://raw.githubusercontent.com/mashidayat24/krn/main/pdf/KRN%20KEJAJAR.pdf'
    ];
    let currentResults = [];
    let pdfDoc = null;
    let pageNum = 1;
    let pageRendering = false;
    let pageNumPending = null;
    let scale = window.innerWidth < 768 ? 1.0 : 1.5;
    let currentPdfUrl = '';
    let pdfCache = {};

    function showCacheIndicator(message){
      const el = document.createElement('div');
      el.className = 'cache-indicator';
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 1800);
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function loadCSV(){
      try{
        const storedData = await window.storage?.get?.('csv-data');
        if (storedData && storedData.value){
          const data = JSON.parse(storedData.value);
          csvData = data.csvData; headers = data.headers;
          showCacheIndicator('Data dimuat dari cache');
          return;
        }
      }catch{}

      try{
        const resp = await fetch('https://raw.githubusercontent.com/telwbo/gantimeterwbo/refs/heads/main/vkrn_sanxing.csv');
        const text = await resp.text();
        parseCSV(text);
        try{ await window.storage?.set?.('csv-data', JSON.stringify({csvData, headers})); }catch{}
        showCacheIndicator('Data diperbarui');
      }catch(e){ console.error('CSV error', e); }
    }

    function parseCSV(text){
      const lines = text.split('\n').filter(l => l.trim());
      if(!lines.length) return;
      headers = lines[0].split(';').map(h => h.trim());
      for(let i=1;i<lines.length;i++){
        const values = lines[i].split(';').map(v => v.trim());
        const row = {};
        headers.forEach((h,idx)=> row[h] = values[idx] || '');
        csvData.push(row);
      }
    }

    function searchData(){
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if(!q){ alert('Silakan masukkan kata kunci pencarian!'); return; }
      const results = csvData.filter(r => Object.values(r).some(v => (v||'').toLowerCase().includes(q)));
      displayResults(results);
    }

    function displayResults(results){
      const searchPage = document.getElementById('searchPage');
      const resultsPage = document.getElementById('resultsPage');
      const resultsContainer = document.getElementById('resultsContainer');
      currentResults = results;
      searchPage.style.display = 'none';
      resultsPage.style.display = 'block';

      if(!results.length){
        resultsContainer.innerHTML = '<div class="no-results">Tidak ada hasil yang ditemukan.</div>';
        return;
      }

      let html = '';
      results.forEach(row=>{
        html += '<div class="result-item"><div class="result-table">';
        headers.forEach(h=>{
          if(row[h]){
            html += '<div class="result-row">';
            html += `<div class="result-label">${h}:</div>`;
            html += `<div class="result-value">${row[h]}</div>`;
            html += '</div>';
          }
        });
        html += '</div></div>';
      });
      resultsContainer.innerHTML = html;
    }

    function goBack(){
      document.getElementById('resultsPage').style.display = 'none';
      document.getElementById('searchPage').style.display = 'block';
      const inp = document.getElementById('searchInput');
      inp.value = ''; inp.focus();
    }

    async function viewPDF(){
      let idpel = '';
      if(currentResults.length){
        const first = currentResults[0];
        for (let k in first){
          if (k.toLowerCase() === 'idpel'){ idpel = first[k]; break; }
        }
      }
      if(!idpel){ alert('ID Pelanggan tidak ditemukan dalam hasil pencarian.'); return; }

      const resultsPage = document.getElementById('resultsPage');
      const pdfPage = document.getElementById('pdfPage');
      const pdfContainer = document.getElementById('pdfContainer');

      resultsPage.style.display = 'none';
      pdfPage.style.display = 'block';
      pdfContainer.innerHTML = `<div class="loading">Mencari "${idpel}" di semua PDF...</div>`;

      try{
        let foundPage = null, foundPdfUrl = null;
        for(const pdfUrl of pdfLinks){
          let pdf;
          if(pdfCache[pdfUrl]){ pdf = pdfCache[pdfUrl]; showCacheIndicator('PDF dimuat dari cache'); }
          else{
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            pdf = await loadingTask.promise; pdfCache[pdfUrl] = pdf;
          }
          for(let p=1; p<=pdf.numPages; p++){
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            const text = textContent.items.map(i=>i.str).join(' ');
            if(text.includes(idpel)){ foundPage = p; foundPdfUrl = pdfUrl; pdfDoc = pdf; break; }
          }
          if(foundPage){ currentPdfUrl = foundPdfUrl; break; }
        }

        if(foundPage){
          const pdfName = foundPdfUrl.split('/').pop().replace(/%20/g,' ');
          pdfContainer.innerHTML = `
            <div style="text-align:center; padding:10px; background: var(--blue-soft); border-radius:10px; margin-bottom:10px; color: var(--blue-dark); font-weight:700;">
              📄 ${pdfName}
            </div>
            <div id="pdfControls">
              <button class="btn" onclick="previousPage()" style="background:#eff6ff; color:var(--blue-dark); border:2px solid var(--blue)">◄ Prev</button>
              <span style="margin:0 12px;">Halaman: <span id="pageNum"></span> / <span id="pageCount"></span></span>
              <button class="btn" onclick="nextPage()" style="background:var(--blue); color:#fff;">Next ►</button>
            </div>
            <div style="text-align:center; overflow:auto;">
              <canvas id="pdfCanvas" style="max-width:100%; height:auto; border:1px solid var(--line); border-radius:10px;"></canvas>
            </div>`;
          pageNum = foundPage;
          document.getElementById('pageCount').textContent = pdfDoc.numPages;
          renderPage(pageNum);
        }else{
          pdfContainer.innerHTML = `<div class="no-results">ID Pelanggan "${idpel}" tidak ditemukan dalam semua PDF.</div>`;
        }
      }catch(err){
        console.error('Error loading PDF:', err);
        pdfContainer.innerHTML = '<div class="no-results">Gagal memuat PDF. Silakan coba lagi.</div>';
      }
    }

    function renderPage(num){
      pageRendering = true;
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');
      pdfDoc.getPage(num).then(function(page){
        const viewport = page.getViewport({scale});
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        const renderContext = { canvasContext: ctx, viewport };
        const renderTask = page.render(renderContext);
        renderTask.promise.then(function(){
          pageRendering = false;
          if(pageNumPending !== null){ renderPage(pageNumPending); pageNumPending = null; }
        });
      });
      document.getElementById('pageNum').textContent = num;
    }

    function queueRenderPage(num){ if(pageRendering){ pageNumPending = num; } else { renderPage(num); } }
    function previousPage(){ if(pageNum <= 1) return; pageNum--; queueRenderPage(pageNum); }
    function nextPage(){ if(pageNum >= pdfDoc.numPages) return; pageNum++; queueRenderPage(pageNum); }
    function backToResults(){ document.getElementById('pdfPage').style.display='none'; document.getElementById('resultsPage').style.display='block'; }

    function openWhatsAppForm(){
      if(!currentResults.length){ alert('Tidak ada data hasil pencarian.'); return; }
      const selected = currentResults.length >= 5 ? currentResults[4] : currentResults[0];
      let idpel='', nama='', kelurahan='', kecamatan='';
      for(let k in selected){
        const lk = k.toLowerCase();
        if(lk==='idpel') idpel = selected[k];
        else if(lk==='nama' || lk.includes('nama_pelanggan')) nama = selected[k];
        else if(lk==='nama_kelurahan' || lk.includes('kelurahan')) kelurahan = selected[k];
        else if(lk==='nama_kecamatan' || lk.includes('kecamatan')) kecamatan = selected[k];
      }
      document.getElementById('waIdpel').value = idpel || '';
      document.getElementById('waNama').value = nama || '';
      document.getElementById('waKelurahan').value = kelurahan || '';
      document.getElementById('waKecamatan').value = kecamatan || '';
      document.getElementById('waLokasi').value = '';
      document.getElementById('waPhone').value = '';
      document.getElementById('resultsPage').style.display='none';
      document.getElementById('waFormPage').style.display='block';
    }

    function getCurrentLocation(){
      const lokasiInput = document.getElementById('waLokasi');
      if(!navigator.geolocation){ alert('Geolocation tidak didukung di browser ini.'); return; }
      lokasiInput.value = 'Mendapatkan lokasi...';
      navigator.geolocation.getCurrentPosition(function(pos){
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        const acc = pos.coords.accuracy.toFixed(0);
        lokasiInput.value = `${lat}, ${lon} (±${acc}m)`;
      }, function(error){
        let msg = '';
        switch(error.code){
          case error.PERMISSION_DENIED: msg='Izin lokasi ditolak'; break;
          case error.POSITION_UNAVAILABLE: msg='Lokasi tidak tersedia'; break;
          case error.TIMEOUT: msg='Timeout'; break;
          default: msg='Error mendapatkan lokasi';
        }
        lokasiInput.value = msg;
        alert('Gagal mendapatkan lokasi: ' + msg);
      }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
    }

    function closeWhatsAppForm(){
      document.getElementById('waFormPage').style.display='none';
      document.getElementById('resultsPage').style.display='block';
    }

    async function sendToWhatsApp(){
      try{
        const idpel = (document.getElementById('waIdpel')?.value || '').trim();
        const nama = (document.getElementById('waNama')?.value || '').trim();
        const kelurahan = (document.getElementById('waKelurahan')?.value || '').trim();
        const kecamatan = (document.getElementById('waKecamatan')?.value || '').trim();
        const lokasi = (document.getElementById('waLokasi')?.value || '').trim();
        const tegangan = (document.getElementById('waTegangan')?.value || '').trim();

        if(!lokasi){ alert('Silakan dapatkan lokasi perangkat terlebih dahulu!'); return; }

        const message =
`LAPORAN PEMASANGAN
VKRN KWH SANXING

Nama : ${nama || '-'}
IDPEL : ${idpel || '-'}
Kelurahan : ${kelurahan || '-'}
Kecamatan : ${kecamatan || '-'}
Tegangan kwh sanxing : ${tegangan} V
Lokasi Pemasangan :
${lokasi}`;

        try{ await navigator.clipboard.writeText(message); }catch{}
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        const opened = window.open(url, '_blank');
        if(!opened) window.location.href = url;
      }catch(err){
        console.error('sendToWhatsApp error:', err);
        alert('Terjadi kesalahan saat menyiapkan pengiriman WhatsApp. Silakan coba lagi.');
      }
    }

    document.getElementById('searchInput').addEventListener('keypress', e=>{
      if(e.key === 'Enter') searchData();
    });

    window.onload = ()=>{ loadCSV(); };
  </script>
</body>
</html>
