<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Data</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .search-page {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1e3c72;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(218, 165, 32, 0.3);
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-search {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            margin-bottom: 15px;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42, 82, 152, 0.4);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .result-page {
            display: none;
            height: 100vh;
            padding: 20px;
        }

        .result-container {
            background: white;
            border-radius: 20px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .result-header {
            display: none;
        }

        .result-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .data-table {
            width: 100%;
        }

        .data-row {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .data-row:hover {
            border-color: #2a5298;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.1);
        }

        .data-field {
            display: flex;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .data-field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            font-weight: 600;
            color: #1e3c72;
            min-width: 100px;
            margin-right: 10px;
            font-size: 14px;
        }

        .field-value {
            color: #333;
            flex: 1;
            word-break: break-word;
            font-size: 14px;
        }

        .field-value input {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .field-value input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .action-buttons {
            padding: 15px 20px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
        }

        .btn-back, .btn-edit, .btn-save, .btn-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .btn-edit {
            background: linear-gradient(135deg, #DAA520 0%, #B8860B 100%);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(218, 165, 32, 0.4);
        }

        .btn-save {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        .btn-cancel {
            background: #dc3545;
            color: white;
        }

        .btn-cancel:hover {
            background: #c82333;
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .no-result i {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #2a5298;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .search-page {
                padding: 20px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .field-label {
                min-width: 80px;
                font-size: 13px;
            }

            .field-value {
                font-size: 13px;
            }

            .result-page {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="searchPage" class="container">
        <div class="search-page">
            <div class="logo">
                <h1>🔍 VKRN SANXING<br>ULP WONOSOBO </h1>
                <p>Masukkan kata kunci untuk mencari data</p>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Ketik kata kunci..." />
            </div>
            <button class="btn btn-search" onclick="searchData()">Cari Data</button>
            <div id="loadingMsg" class="loading" style="display: none;">Memuat data...</div>
        </div>
    </div>

    <div id="resultPage" class="result-page">
        <div class="result-container">
            <div class="result-header">
                <p id="resultCount"></p>
            </div>
            <div class="result-content" id="resultContent"></div>
            <div class="action-buttons" id="actionButtons">
                <button class="btn-back" onclick="backToSearch()">Kembali</button>
                <button class="btn-edit" onclick="enableEdit()">Edit</button>
            </div>
        </div>
    </div>

    <script>
        let csvData = [];
        let searchResults = [];
        let isEditMode = false;
        let originalData = [];

        // Load CSV data
        fetch('https://raw.githubusercontent.com/telwbo/gantimeterwbo/refs/heads/main/vkrn_sanxing.csv')
            .then(response => response.text())
            .then(data => {
                Papa.parse(data, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        csvData = results.data;
                        console.log('Data loaded:', csvData.length, 'rows');
                    }
                });
            })
            .catch(error => {
                console.error('Error loading CSV:', error);
                alert('Gagal memuat data. Silakan coba lagi.');
            });

        function searchData() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!keyword) {
                alert('Masukkan kata kunci pencarian!');
                return;
            }

            if (csvData.length === 0) {
                alert('Data belum dimuat. Silakan tunggu sebentar.');
                return;
            }

            document.getElementById('loadingMsg').style.display = 'block';

            setTimeout(() => {
                searchResults = csvData.filter(row => {
                    return Object.values(row).some(value => 
                        String(value).toLowerCase().includes(keyword)
                    );
                });

                displayResults();
                document.getElementById('loadingMsg').style.display = 'none';
            }, 300);
        }

        function displayResults() {
            const searchPage = document.getElementById('searchPage');
            const resultPage = document.getElementById('resultPage');
            const resultContent = document.getElementById('resultContent');
            const resultCount = document.getElementById('resultCount');

            searchPage.style.display = 'none';
            resultPage.style.display = 'block';

            if (searchResults.length === 0) {
                resultCount.textContent = 'Tidak ada hasil ditemukan';
                resultContent.innerHTML = '<div class="no-result"><div style="font-size: 48px; margin-bottom: 20px;">📭</div><p>Tidak ada data yang cocok dengan pencarian Anda.</p></div>';
                return;
            }

            resultCount.textContent = `Ditemukan ${searchResults.length} hasil`;
            
            let html = '<div class="data-table">';
            searchResults.forEach((row, index) => {
                html += '<div class="data-row" data-index="' + index + '">';
                Object.keys(row).forEach(key => {
                    if (row[key]) {
                        html += '<div class="data-field">';
                        html += '<div class="field-label">' + key + ':</div>';
                        html += '<div class="field-value" data-field="' + key + '">' + row[key] + '</div>';
                        html += '</div>';
                    }
                });
                html += '</div>';
            });
            html += '</div>';

            resultContent.innerHTML = html;
        }

        function enableEdit() {
            isEditMode = true;
            originalData = JSON.parse(JSON.stringify(searchResults));

            const fieldValues = document.querySelectorAll('.field-value');
            fieldValues.forEach(field => {
                const currentValue = field.textContent;
                const fieldName = field.getAttribute('data-field');
                field.innerHTML = '<input type="text" value="' + currentValue + '" data-field="' + fieldName + '" />';
            });

            document.getElementById('actionButtons').innerHTML = `
                <button class="btn-cancel" onclick="cancelEdit()">Batal</button>
                <button class="btn-save" onclick="saveData()">Simpan</button>
            `;
        }

        function saveData() {
            const dataRows = document.querySelectorAll('.data-row');
            
            dataRows.forEach((row, rowIndex) => {
                const inputs = row.querySelectorAll('input');
                inputs.forEach(input => {
                    const fieldName = input.getAttribute('data-field');
                    searchResults[rowIndex][fieldName] = input.value;
                });
            });

            // Update original csvData
            searchResults.forEach(result => {
                const index = csvData.findIndex(item => 
                    JSON.stringify(item) === JSON.stringify(originalData[searchResults.indexOf(result)])
                );
                if (index !== -1) {
                    csvData[index] = result;
                }
            });

            alert('Data berhasil disimpan!');
            isEditMode = false;
            displayResults();
            
            document.getElementById('actionButtons').innerHTML = `
                <button class="btn-back" onclick="backToSearch()">Kembali</button>
                <button class="btn-edit" onclick="enableEdit()">Edit</button>
            `;
        }

        function cancelEdit() {
            searchResults = JSON.parse(JSON.stringify(originalData));
            isEditMode = false;
            displayResults();
            
            document.getElementById('actionButtons').innerHTML = `
                <button class="btn-back" onclick="backToSearch()">Kembali</button>
                <button class="btn-edit" onclick="enableEdit()">Edit</button>
            `;
        }

        function backToSearch() {
            document.getElementById('searchPage').style.display = 'block';
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('searchInput').value = '';
            searchResults = [];
            isEditMode = false;
        }

        // Enable search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchData();
            }
        });
    </script>
</body>
</html>
